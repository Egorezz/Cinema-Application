include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    public_member_api_docs: false # app code, not a package
    unnecessary_type_name_in_constructor: false # keep classic `const ClassName(...)` constructors, not `const new(...)`
