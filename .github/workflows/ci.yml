name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter (format · analyze · test · build)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed $(ls -d lib test integration_test test_driver 2>/dev/null)

      - name: Analyze
        run: flutter analyze

      - name: Unit & widget tests
        run: |
          if [ -d test ]; then
            flutter test --reporter github
          else
            echo "No test/ directory yet — skipping"
          fi

      - name: Build web (release)
        run: |
          DEFINES=""
          if [ -f env/example.json ]; then DEFINES="--dart-define-from-file=env/example.json"; fi
          flutter build web --release $DEFINES

  supabase:
    name: Supabase (migrations · pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Detect Supabase project
        id: detect
        run: |
          if [ -f supabase/config.toml ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: supabase/setup-cli@v3
        if: steps.detect.outputs.present == 'true'
        with:
          version: 3.2.0

      - name: Start database (applies migrations + seed)
        if: steps.detect.outputs.present == 'true'
        run: supabase db start

      - name: pgTAP tests
        if: steps.detect.outputs.present == 'true' && hashFiles('supabase/tests/**') != ''
        run: supabase test db

      - name: Skip notice
        if: steps.detect.outputs.present != 'true'
        run: echo "No supabase/ project yet — skipping"
